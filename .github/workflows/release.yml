# Builds a release when a version tag is pushed.
#
# The tag has to match the version in CMakeLists.txt — the workflow checks, and fails if it
# does not. That is what keeps the promise the updater relies on: the release called v0.6.0
# contains a build that says it is 0.6.0, so a game can compare the two and be right.
#
# What comes out: a zip with the executable, its shaders and the licence, and a build
# provenance attestation. See documentation/15-releases.md for what the attestation is for
# and what it does not replace.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build, e.g. v0.5.0"
        required: true

permissions:
  contents: write      # to create the release
  id-token: write      # to sign the provenance attestation
  attestations: write

jobs:
  # THE WORLD BAKE, AND IT IS A `needs:` RATHER THAN A STEP SO THAT IT CANNOT BE SKIPPED.
  #
  # D684: a stale baked world cannot be detected on an install. `shipped_stamp()` is
  # `kWorldBuildVersion` and nothing else, because that is the only stamp a machine with no source
  # tree can compute — so it sees the world FORMAT change and is blind to the SAMPLER changing
  # underneath it. There is no check the game can make. The only defence is that every release
  # bakes from its own commit, which is what naming the bake here buys: the release waits for it,
  # and a bake that fails is a release that does not happen.
  #
  # It runs at this commit, because `uses: ./` in the same repository always does.
  # And it bakes the WHOLE world, which is the second half and is newer than the first.
  # `--bake-world` on its own saves what the refinement ladder REACHED, and the ladder is driven
  # by what a camera can see — so a release baked that way ships a world complete where the baking
  # camera stood and coarse everywhere else, which is the floor with no walls the user
  # photographed. `--refine-all` refines every node regardless, and then the file is the world.
  # `require_whole` is what makes a shortfall stop the release instead of shrinking the download
  # quietly: a partial world reads, gates and photographs exactly like a complete one.
  bake:
    uses: ./.github/workflows/bake-world.yml
    with:
      clips: facility
      seconds: 240
      passes: 45
      total_minutes: 200
      require_whole: 'true'
      budget_mb: 128

  windows:
    needs: bake
    runs-on: windows-latest
    env:
      # Lifted to the job so the signing step's `if` can see it. A step cannot read the env
      # it declares itself, so testing the secret there would skip the step forever.
      WS_SIGNING_CERT: ${{ secrets.WS_SIGNING_CERT }}
      WS_SIGNING_PASSWORD: ${{ secrets.WS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version, and check the tag agrees with it
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            '${{ inputs.tag }}'
          }
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(WorldShaper VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "could not find the version in CMakeLists.txt"
          }
          $version = $Matches[1]
          if ($tag -ne "v$version") {
            throw "the tag is $tag but CMakeLists.txt says $version - bump one of them"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "building $tag"

      # The SDK is a build tool: it provides the headers, the loader stub and glslc. None of
      # it is redistributed with the game, which loads Vulkan through volk at runtime.
      #
      # PINNED, and that is what this workflow failed on for three releases.
      #
      # It asked for `latest`, so the version was whatever LunarG was serving on the morning of
      # the run, and on v0.7.0 that glslc **crashed with an access violation compiling
      # clouds.comp** — `FAILED: [code=3221225477]`, which is 0xC0000005. Ninja stopped, CMake
      # said "build tool execution failed", and the failure was written down here as the runner
      # crashing its own C++ compiler. It was not: every .obj in that run compiled, and the
      # thing that died was the SHADER compiler out of the SDK this step installs. A build tool
      # that changes under you between runs is not a build tool, it is weather.
      #
      # 1.4.341.0 because that is the SDK generation the project already targets — volk is
      # pinned to `vulkan-sdk-1.4.341.0` in cmake/Dependencies.cmake — so this is the workflow
      # agreeing with the source rather than a new number to keep in step.
      #
      # The version is PRINTED. When this next breaks, the log should say which glslc it was.
      - name: Install the Vulkan SDK
        shell: pwsh
        env:
          WS_VULKAN_SDK: 1.4.341.0
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:WS_VULKAN_SDK/windows/vulkan-sdk.exe"
          Write-Host "Vulkan SDK $env:WS_VULKAN_SDK from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe"
          $args = @('--root', 'C:\VulkanSDK', '--accept-licenses',
                    '--default-answer', '--confirm-command', 'install')
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" -ArgumentList $args -Wait
          "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
          "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH
          & C:\VulkanSDK\Bin\glslc.exe --version

      - uses: ilammy/msvc-dev-cmd@v1

      # Ninja is not on the runner's PATH by default, and vcvars does not add it.
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

      # The same tests that guard a local change guard a release. A build that fails them
      # never becomes a download.
      - name: Test
        shell: pwsh
        run: |
          .\build\bin\ws_tests.exe
          .\build\bin\WorldShaper.exe --ticks 20000

      - name: Check the built game agrees about its version
        shell: pwsh
        run: |
          $reported = (Get-Item .\build\bin\WorldShaper.exe).VersionInfo.FileVersion
          if ($reported -ne '${{ steps.version.outputs.version }}') {
            throw "the executable says $reported, the tag says ${{ steps.version.outputs.version }}"
          }

      # THE BAKED WORLDS, INTO THE DIRECTORY THAT SHIPS.
      #
      # Before Package, for the same reason signing is: `Copy-Item build\bin\clips` is what puts
      # the clips in the zip, so anything that is to travel with them has to be in that folder
      # first. `--bake-world` writes `clips\facility.clip` -> `clips\facility.world`, and
      # `cmake/copy_clips.cmake` drops only `.clip.world` and `.clip.load`, so the name is already
      # one that survives a rebuild of that folder.
      #
      # The size is PRINTED. A download that grows is a decision somebody should be able to see
      # having been made; the bake workflow refuses to go over its own budget, and this line is
      # where the number reaches the release log.
      - name: Take the baked worlds
        uses: actions/download-artifact@v4
        with:
          name: world-bake
          path: bake

      - name: ...and put them where the clips ship from
        shell: pwsh
        run: |
          $worlds = Get-ChildItem bake\clips -Filter '*.world' -ErrorAction SilentlyContinue
          if (-not $worlds) { throw "the bake produced no worlds; a release must not ship without them" }
          foreach ($w in $worlds) {
            Copy-Item $w.FullName build\bin\clips\ -Force
            Write-Host ("{0}  {1:N2} MB" -f $w.Name, ($w.Length / 1MB))
          }
          Write-Host "the download grows by ${{ needs.bake.outputs.total_mb }} MB"

      # Before packaging, or the zip would carry the unsigned executable and the signature
      # would be on a file nobody downloads.
      #
      # Only runs when the certificate secrets exist, so the workflow works without them and
      # starts signing the moment they are added. See documentation/15-releases.md.
      - name: Sign the executable
        if: ${{ env.WS_SIGNING_CERT != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx",
                                   [Convert]::FromBase64String($env:WS_SIGNING_CERT))
          & signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WS_SIGNING_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            build\bin\WorldShaper.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force

      - name: Package
        shell: pwsh
        run: |
          $name = "WorldShaper-${{ steps.version.outputs.tag }}-windows-x64"
          New-Item -ItemType Directory -Path "package\$name" | Out-Null
          Copy-Item build\bin\WorldShaper.exe "package\$name\"
          Copy-Item build\bin\SDL3.dll "package\$name\"
          Copy-Item build\bin\shaders "package\$name\shaders" -Recurse
          # The clips, which this step did not copy and which are the entire game. Everything
          # about a world is read from the folder the executable is in: the worlds shelf seeds
          # itself from there, an include that is not beside its own file is looked for there,
          # and the facility is a manifest plus twenty-two fragments that live there. Without
          # this a download opens on an empty shelf and says it did not build anything. D640.
          # From build\bin\clips because that copy has already had the built worlds dropped out
          # of it — the facility's is over half a gigabyte.
          Copy-Item build\bin\clips "package\$name\clips" -Recurse
          Copy-Item LICENSE, README.md "package\$name\"
          Compress-Archive -Path "package\$name\*" -DestinationPath "package\$name.zip"
          "package=package/$name.zip" >> $env:GITHUB_ENV
          "zipname=$name.zip" >> $env:GITHUB_ENV
          # The checksum goes in the release text as well as in a file. Two downloads where
          # only one is the game is a question every player asks once, and the answer should
          # be on the page rather than in a file they have to open to find out.
          $hash = (Get-FileHash "package\$name.zip" -Algorithm SHA256).Hash
          $hash | Out-File "package\$name.zip.sha256" -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_ENV

      # The download is opened somewhere else and made to build the world it ships with.
      #
      # This is the gate v0.7.0 needed and did not have. Everything above this line tests the
      # BUILD TREE, where every path resolves because the source is sitting right there — and
      # the release that shipped without any clips in it passed all of it. `tools/package.ps1`
      # has a gate of this shape for the same reason (a shader path baked to the build machine
      # at v0.6.0), but it starts the game, and a runner has no graphics card.
      #
      # It does not need one. `--clip-file` with no `--screenshot` is the clip tool: it parses
      # the manifest, splices in the twenty-two fragments, samples the building and reports it,
      # entirely on the CPU. If the clips are missing from the zip it exits non-zero, and if
      # they are there it prints how many voxels the facility came to. At metre 4 rather than
      # the authored 32 because what is being tested is that the download HAS a game in it.
      - name: Check the download has a game in it
        shell: pwsh
        run: |
          $name = "WorldShaper-${{ steps.version.outputs.tag }}-windows-x64"
          $out = Join-Path $env:RUNNER_TEMP "unpacked"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path "package\$name.zip" -DestinationPath $out -Force

          # Named one at a time, so a missing one says which.
          foreach ($needed in @('WorldShaper.exe', 'SDL3.dll',
                                'shaders\visibility.comp.spv', 'clips\facility.clip',
                                'clips\facility.world')) {
            if (-not (Test-Path (Join-Path $out $needed))) {
              throw "the zip has no $needed in it"
            }
          }

          Push-Location $out
          try {
            $log = & .\WorldShaper.exe --clip-file clips\facility.clip --clip-metre 4 2>&1 |
                   Out-String
            Write-Host $log
            if ($LASTEXITCODE -ne 0) {
              throw "the shipped facility did not build (exit $LASTEXITCODE)"
            }
          } finally {
            Pop-Location
          }
          $volume = [regex]::Match($log, "volume\s+(\d+) voxels")
          if (-not $volume.Success) { throw "the clip tool reported no volume at all" }
          if ([int64]$volume.Groups[1].Value -le 0) {
            throw "the shipped facility built to nothing"
          }
          Write-Host "the unpacked download built the facility: $($volume.Groups[1].Value) voxels"

      # ------------------------------------------------------------------------------------------
      # AND THAT THE BAKED WORLD IS READ, WHICH IS A DIFFERENT QUESTION FROM IT BEING PRESENT.
      #
      # D685 is this gate's whole reason for existing. The bake was built, measured, photographed
      # and reported as working, and it did nothing at all on the only path a player uses — because
      # every measurement was taken with `--clip-file` and a player opens the shelf. The file was
      # in the download. It was simply never looked at. Nothing about a `.world` sitting in a zip
      # says the game will use it, and if the key does not match it is refused in silence and the
      # sampler runs for four minutes exactly as it did before.
      #
      # So: unpack, hand the game an empty data root, let it seed its own shelf from the shipped
      # clips the way a first launch does, open the world off that shelf, and require the line
      # `opened the world shipped at`. `tools\bake_world.ps1 -GateOnly` is that, and it is the same
      # code path a person runs by hand — a gate nobody can run is a gate nobody checks.
      #
      # UNVERIFIED FROM A DEVELOPMENT MACHINE: this needs a Vulkan device and a hosted runner has
      # no graphics card, so it borrows the software one the bake workflow installs. If that turns
      # out not to work on a runner, this step fails and no release is published — which is the
      # correct way round, and documentation/15-releases.md says what to do instead.
      # ------------------------------------------------------------------------------------------
      - name: A Vulkan that does not need a graphics card
        shell: pwsh
        env:
          WS_MESA: '24.3.4'
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:WS_MESA/mesa3d-$env:WS_MESA-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          & 7z x "$env:RUNNER_TEMP\mesa.7z" -o"$env:RUNNER_TEMP\mesa" -y | Out-Null
          $icd = Get-ChildItem "$env:RUNNER_TEMP\mesa" -Recurse -Filter 'lvp_icd.x86_64.json' |
                 Select-Object -First 1
          if (-not $icd) { throw "no lavapipe ICD in the Mesa archive -- the layout changed" }
          "VK_DRIVER_FILES=$($icd.FullName)" >> $env:GITHUB_ENV
          "VK_ICD_FILENAMES=$($icd.FullName)" >> $env:GITHUB_ENV

      - name: Check the download's world is READ and not just present
        shell: pwsh
        run: |
          # No exit-code test after it: the script throws, and a throw is already a failed step.
          # Testing $LASTEXITCODE here would read whatever the last NATIVE command left behind,
          # which is not the script and is usually zero.
          $out = Join-Path $env:RUNNER_TEMP "unpacked"
          .\tools\bake_world.ps1 -Game $out -Clips facility -GateOnly

      # Signs a statement, in GitHub's name, that this exact file came out of this exact
      # commit through this exact workflow. Free, and verifiable with `gh attestation verify`.
      # It is not a code-signing certificate and does not stop SmartScreen — see
      # documentation/15-releases.md.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ env.package }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WorldShaper ${{ steps.version.outputs.tag }}
          files: |
            package/*.zip
            package/*.sha256
          body: |
            ## WorldShaper ${{ steps.version.outputs.tag }}

            **Download `${{ env.zipname }}`.** That is the game — unzip it anywhere and run
            `WorldShaper.exe`. Needs Windows 10 or later and a graphics card with Vulkan 1.3
            drivers.

            The `.sha256` file next to it is not something to run. It holds one line — the
            checksum below — for anyone who wants to confirm their copy arrived intact.

            The game checks for newer releases when it starts and offers them; it never
            downloads anything without being asked.

            ### Is this safe to run?

            It is not signed with a code-signing certificate, so Windows SmartScreen will
            warn about it. That warning means "nobody has paid a certificate authority to
            vouch for this", not "this is malware" — and you should not simply take my word
            for it either. What you can check instead:

            - **Where it came from.** This release carries a build provenance attestation
              signed by GitHub, tying this exact file to the commit and workflow that
              produced it. Verify it yourself:
              `gh attestation verify ${{ env.zipname }} --repo ${{ github.repository }}`
            - **That it has not been altered.** Its SHA-256 is

              ```
              ${{ env.sha256 }}
              ```

              which you can check with `Get-FileHash <the zip>` in PowerShell.
            - **What it does.** The whole source is here, and the build that made this file
              is the workflow in `.github/workflows/release.yml`.
