# The clip viewer: bake the clips somebody is actually working on, and publish the site.
#
# documentation/24-clip-viewer.md says what the site is. This is how it stays current, and the
# awkward part is which COMMIT to bake.
#
# The obvious answer -- bake `main` on every push to `main` -- produced a site that was correct and
# useless. The facility's overhaul lived on `claude/facility-building-overhaul-deuuxo` for a day:
# sixteen commits, fourteen thousand lines, a ballroom, a chapel, a crypt, a library and a whole
# estate, none of it on `main`. The site showed `main`, faithfully, and read as simply out of date.
#
# Nor is "also trigger on the branch" enough on its own, and this is the part that is easy to get
# wrong: **GitHub runs the workflow file from the branch being pushed.** A branch cut before this
# file existed does not have it, so pushing to that branch runs nothing at all. The push triggers
# below therefore only help branches made from now on.
#
# So the job PICKS its own ref: the branch whose most recent commit to `clips/` is the newest, out
# of `main` and every `claude/**`. It then checks that branch out and builds the baker from it too,
# which is not fussiness -- `arc_test.clip` uses an `arc` shape that exists only on the branch that
# added it, and a baker built from `main` cannot read that file.
#
# It is a LINUX job with no Vulkan SDK and no SDL, which is what `-DWS_TOOLS_ONLY=ON` is for: the
# baker needs the field, the sampler and the type table, and none of those know what a GPU is. It
# also means this workflow cannot be broken by a graphics dependency moving under it, which is
# exactly how the release workflow was broken for months (D641).
name: pages

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'clips/**'
      - 'src/forge/**'
      - 'src/world/**'
      - 'src/game/**'
      - 'src/core/**'
      - 'tools/bake_web.cpp'
      - 'web/**'
      - 'CMakeLists.txt'
      - '.github/workflows/pages.yml'
  # And a sweep, for the branches that cannot trigger anything themselves. It costs almost nothing
  # when nothing has changed: the job asks the published site what it is already showing and stops.
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to bake (blank picks the newest clip work)'
        required: false
        default: ''

# One deployment at a time, and a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every branch, because the job chooses between them

      - name: Which clips are the newest
        id: pick
        run: |
          set -euo pipefail
          # A push says LOOK AGAIN. It does not say what to bake.
          #
          # Taking the pushed branch was the obvious reading and it is wrong every time it matters:
          # a push to `main` bakes `main`, a push to the viewer's own branch bakes the viewer's own
          # branch, and neither is where the new clips are. The site's whole job is to show the
          # newest clip work, so the answer does not depend on which branch happened to move --
          # only an explicit dispatch overrides it.
          chosen="${{ github.event.inputs.ref }}"
          if [ -z "$chosen" ]; then
            best=""; best_at=0
            for ref in $(git for-each-ref --format='%(refname:short)' \
                         'refs/remotes/origin/main' 'refs/remotes/origin/claude/**'); do
              at=$(git log -1 --format=%ct "$ref" -- clips/ 2>/dev/null || true)
              [ -z "${at:-}" ] && at=0
              if [ "$at" -gt "$best_at" ]; then best_at="$at"; best="${ref#origin/}"; fi
            done
            chosen="${best:-main}"
          fi
          # A GRAFT, not a checkout, and the difference is the whole reason this works.
          #
          # A branch that is only writing clips does not have this workflow, does not have
          # `tools/bake_web.cpp`, does not have a CMakeLists that knows what `ws_bake_web` is, and
          # does not have `web/` at all -- the viewer was added on `main` after that branch was
          # cut. Checking it out wholesale leaves nothing to build and nothing to publish.
          #
          # So: stay on `main` for the machinery and the site, and take `clips/` and `src/` from the
          # branch. `src/` because the clips and the forge are one thing -- `arc_test.clip` uses an
          # `arc` shape that exists only on the branch that added it, and a parser from `main`
          # reports it as unknown. Anything the graft cannot compile fails here, loudly, which is
          # the right place for it to fail.
          sha="$(git rev-parse --short "origin/$chosen" 2>/dev/null || git rev-parse --short "$chosen")"
          if [ "$chosen" != "main" ]; then
            git checkout "origin/$chosen" -- clips/ src/ 2>/dev/null \
              || git checkout "$chosen" -- clips/ src/
          fi
          echo "ref=$chosen" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Baking $chosen at $sha"

          # What is already up there? A twenty-minute sweep that rebakes an unchanged building is
          # twenty minutes of a runner and a redeploy nobody asked for.
          published=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            published="$(curl -fsS --max-time 20 \
              "https://worldshapergame.github.io/WorldShaper/data/index.json?ci=$GITHUB_RUN_ID" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' \
              2>/dev/null || true)"
          fi
          if [ -n "$published" ] && [ "$published" = "$sha" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$sha is already published; nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ninja
        if: steps.pick.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Keyed on the sources it compiles, so a push that only edits a clip relinks and goes straight
      # to baking.
      - name: Cache the build
        if: steps.pick.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: build-web
          key: pages-build-${{ runner.os }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**', 'tools/bake_web.cpp') }}
          restore-keys: pages-build-${{ runner.os }}-

      - name: Build the baker
        if: steps.pick.outputs.skip != 'true'
        run: |
          cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DWS_TOOLS_ONLY=ON
          cmake --build build-web --target ws_bake_web

      # A WHOLE CLIP AT THE RESOLUTION IT WAS AUTHORED AT -- 32 voxels to the metre, 3.125 cm, the
      # game's own -- and its PARTS at half that.
      #
      # It was 16 for everything, and the answer to that was "it doesn't show the clips at full
      # detail level", which is fair: half resolution is where a 4.5 cm bead stops being a bead.
      # Then 32 for everything, which does not fit in a runner. The numbers, measured on the
      # overhauled facility, are that sampling costs about six times as much per doubling:
      #
      #     8 / metre      21.7 s     196,076 quads     4.7 MB
      #    16 / metre     131.2 s     562,008 quads    10.3 MB
      #    32 / metre     ~13 min   ~1,700,000 quads   ~20 MB
      #
      # Sixty-three clips at 32 is about two and a half hours, because a fragment is sampled with
      # the whole building's paint and intersected with the whole building's solid and so costs
      # like a small facility. The building at 32 with its parts at 16 is about thirty-five
      # minutes, and is the right split anyway: the whole clip is the thing you look at, a
      # fragment answers "is my morning's work the right shape".
      - name: Bake every clip
        if: steps.pick.outputs.skip != 'true'
        run: |
          ./build-web/bin/ws_bake_web --clips clips --out web/data \
                                      --budget 700000000 --max-metre 32 --part-metre 16 \
                                      --branch "${{ steps.pick.outputs.ref }}" \
                                      --commit "${{ steps.pick.outputs.sha }}"
          du -sh web/data

      # A compressed copy beside each file, which the viewer asks for first. Pages will not compress
      # an unknown extension itself and the quads come down about four to one.
      - name: Compress
        if: steps.pick.outputs.skip != 'true'
        run: |
          gzip -9 -k web/data/*.wsc
          du -sh web/data

      # The viewer routes on the URL fragment, so there is one page and nothing for Jekyll to build.
      - name: Not a Jekyll site
        if: steps.pick.outputs.skip != 'true'
        run: touch web/.nojekyll

      # `enablement` turns Pages on for a repository that has never had it, rather than failing and
      # asking somebody to go and click it. Without it the first run got all the way through --
      # forty clips baked in four minutes seventeen -- and then stopped on "Get Pages site failed:
      # Not Found", which is a whole bake thrown away over a setting.
      - uses: actions/configure-pages@v5
        if: steps.pick.outputs.skip != 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pick.outputs.skip != 'true'
        with:
          path: web

  publish:
    needs: bake
    if: needs.bake.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
